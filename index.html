<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Translator Diagnostic</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 10px;
}

#top-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 5px;
    font-weight: bold;
}

#btn-start {
    background: #28a745;
    color: white;
}

#btn-stop {
    background: #dc3545;
    color: white;
    display: none;
}

#btn-clear {
    background: #444;
    color: white;
}

#diagnostico {

    background: #111;

    border: 1px solid #333;

    border-radius: 6px;

    padding: 8px;

    margin-bottom: 8px;

    height: 130px;

    overflow-y: auto;

    font-family: monospace;

    font-size: 12px;

    line-height: 1.5;

}

#hud-container {

    flex: 1;

    border: 1px solid #222;

    border-radius: 6px;

    padding: 10px;

    background: #050505;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

}

#translation-list {

    list-style: none;

    display: flex;

    flex-direction: column;

    gap: 10px;

}

.translation {

    color: #00ffcc;

    font-size: 22px;

    font-weight: bold;

    line-height: 1.25;

    border-left: 4px solid #00ffcc;

    padding-left: 10px;

    word-wrap: break-word;

}

.status {

    color: #888;

    font-size: 13px;

}

.error {

    color: #ff5555;

}

</style>

</head>

<body>

<div id="top-bar">

<button id="btn-start"
        onclick="iniciarOuvinte()">

▶ INICIAR

</button>

<button id="btn-stop"
        onclick="pararOuvinte()">

■ PARAR

</button>

<button id="btn-clear"
        onclick="limparTela()">

LIMPAR

</button>

</div>

<div id="diagnostico">

<div>SISTEMA AGUARDANDO...</div>

</div>

<div id="hud-container">

<ul id="translation-list"></ul>

</div>

<script>

let socket = null;

let stream = null;

let audioContext = null;

let analyser = null;

let microphone = null;

let mediaRecorder = null;

let audioChunks = [];

let isListening = false;

let speaking = false;

let silenceTimer = null;


/* ============================
   DIAGNÓSTICO
============================ */

function diagnostico(texto) {

    const painel =
        document.getElementById('diagnostico');

    const linha =
        document.createElement('div');

    linha.innerText =
        new Date().toLocaleTimeString() +
        '  ' +
        texto;

    if (texto.includes('ERRO')) {
        linha.className = 'error';
    }

    painel.appendChild(linha);

    painel.scrollTop =
        painel.scrollHeight;

}


/* ============================
   INICIAR
============================ */

async function iniciarOuvinte() {

    try {

        diagnostico(
            '🎤 SOLICITANDO MICROFONE...'
        );

        stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio: true
            });

        diagnostico(
            '🎤 MICROFONE LIBERADO'
        );


        const protocolo =
            location.protocol === 'https:'
            ? 'wss:'
            : 'ws:';


        socket =
            new WebSocket(
                `${protocolo}//${location.host}`
            );


        socket.onopen = async () => {

            diagnostico(
                '🔌 WEBSOCKET CONECTADO'
            );


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            if (
                audioContext.state ===
                'suspended'
            ) {

                await audioContext.resume();

            }


            diagnostico(
                '🔊 AUDIOCONTEXT: ' +
                audioContext.state
            );


            analyser =
                audioContext
                .createAnalyser();

            analyser.fftSize = 512;


            microphone =
                audioContext
                .createMediaStreamSource(
                    stream
                );


            microphone.connect(
                analyser
            );


            mediaRecorder =
                new MediaRecorder(
                    stream
                );


            mediaRecorder.ondataavailable =
                (event) => {

                    if (
                        event.data.size > 0
                    ) {

                        audioChunks.push(
                            event.data
                        );

                    }

                };


            mediaRecorder.onstop =
                enviarGravacao;


            isListening = true;

            document
                .getElementById(
                    'btn-start'
                )
                .style.display =
                'none';

            document
                .getElementById(
                    'btn-stop'
                )
                .style.display =
                'block';


            diagnostico(
                '👂 VAD ATIVO. FALE EM INGLÊS.'
            );


            monitorarVoz();

        };


        socket.onmessage =
            (event) => {

                const data =
                    JSON.parse(
                        event.data
                    );


                if (
                    data.type ===
                    'diagnostico'
                ) {

                    diagnostico(
                        data.text
                    );

                }


                if (
                    data.type ===
                    'translation'
                ) {

                    diagnostico(
                        '✅ TRADUÇÃO RECEBIDA NO CELULAR'
                    );

                    adicionarTraducao(
                        data.text
                    );

                }

            };


        socket.onerror =
            () => {

                diagnostico(
                    '❌ ERRO NO WEBSOCKET'
                );

            };


        socket.onclose =
            () => {

                diagnostico(
                    '🔌 WEBSOCKET FECHADO'
                );

            };


    } catch (erro) {

        diagnostico(
            '❌ ERRO MICROFONE: ' +
            erro.message
        );

    }

}


/* ============================
   VAD
============================ */

function monitorarVoz() {

    if (!isListening) {
        return;
    }


    const bufferLength =
        analyser.frequencyBinCount;


    const dataArray =
        new Uint8Array(
            bufferLength
        );


    analyser.getByteFrequencyData(
        dataArray
    );


    let soma = 0;


    for (
        let i = 0;
        i < bufferLength;
        i++
    ) {

        soma +=
            dataArray[i];

    }


    const media =
        soma / bufferLength;


    if (media > 10) {

        if (!speaking) {

            speaking = true;

            diagnostico(
                '🎤 FALA DETECTADA'
            );


            if (
                mediaRecorder.state ===
                'inactive'
            ) {

                audioChunks = [];

                mediaRecorder.start();

                diagnostico(
                    '🔴 GRAVAÇÃO INICIADA'
                );

            }

        }


        clearTimeout(
            silenceTimer
        );


        silenceTimer =
            setTimeout(() => {

                if (speaking) {

                    speaking = false;

                    if (
                        mediaRecorder.state ===
                        'recording'
                    ) {

                        mediaRecorder.stop();

                        diagnostico(
                            '⏹ PAUSA DETECTADA'
                        );

                    }

                }

            }, 900);

    }


    requestAnimationFrame(
        monitorarVoz
    );

}


/* ============================
   ENVIO
============================ */

function enviarGravacao() {

    if (
        audioChunks.length === 0
    ) {

        diagnostico(
            '⚠️ GRAVAÇÃO VAZIA'
        );

        return;

    }


    const blob =
        new Blob(
            audioChunks,
            {
                type: 'audio/webm'
            }
        );


    audioChunks = [];


    diagnostico(
        '📦 ÁUDIO GERADO: ' +
        Math.round(
            blob.size / 1024
        ) +
        ' KB'
    );


    const reader =
        new FileReader();


    reader.onloadend =
        () => {

            const base64 =
                reader.result
                .split(',')[1];


            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                diagnostico(
                    '📤 ENVIANDO ÁUDIO AO SERVIDOR'
                );


                socket.send(
                    JSON.stringify({

                        type:
                            'audio_chunk',

                        audio:
                            base64

                    })
                );

            } else {

                diagnostico(
                    '❌ WEBSOCKET NÃO ESTÁ ABERTO'
                );

            }

        };


    reader.readAsDataURL(
        blob
    );

}


/* ============================
   HUD
============================ */

function adicionarTraducao(
    texto
) {

    const lista =
        document.getElementById(
            'translation-list'
        );


    const item =
        document.createElement(
            'li'
        );


    item.className =
        'translation';


    item.innerText =
        texto;


    lista.appendChild(
        item
    );


    while (
        lista.offsetHeight >
        document
        .getElementById(
            'hud-container'
        )
        .clientHeight
    ) {

        if (
            lista.children.length <= 1
        ) {

            break;

        }

        lista.removeChild(
            lista.firstChild
        );

    }

}


/* ============================
   PARAR
============================ */

function pararOuvinte() {

    isListening = false;

    speaking = false;


    clearTimeout(
        silenceTimer
    );


    if (
        mediaRecorder &&
        mediaRecorder.state !==
        'inactive'
    ) {

        mediaRecorder.stop();

    }


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

    }


    if (audioContext) {

        audioContext.close();

    }


    if (socket) {

        socket.close();

    }


    document
        .getElementById(
            'btn-start'
        )
        .style.display =
        'block';


    document
        .getElementById(
            'btn-stop'
        )
        .style.display =
        'none';


    diagnostico(
        '⏹ SISTEMA PARADO'
    );

}


/* ============================
   LIMPAR
============================ */

function limparTela() {

    document
        .getElementById(
            'translation-list'
        )
        .innerHTML = '';

    document
        .getElementById(
            'diagnostico'
        )
        .innerHTML = '';

}

</script>

</body>
</html>
