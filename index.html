<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRANSLATOR HUD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        #top-bar { display: flex; gap: 6px; margin-bottom: 8px; }
        button { flex: 1; padding: 14px; font-weight: bold; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; display: none; }
        .btn-clear { background: #444; color: white; flex: 0 0 80px; }
        #hud-container { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid #222; border-radius: 6px; padding: 10px; background: #050505; overflow: hidden; }
        #translation-list { list-style: none; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .translation-item { font-size: 22px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,204,0.4); border-left: 4px solid #00ffcc; padding-left: 10px; font-family: 'Impact', sans-serif; letter-spacing: 0.5px; word-wrap: break-word; }
        .status-item { color: #888; border-left-color: #555; font-size: 14px; font-weight: normal; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="top-bar">
        <button id="btn-start" class="btn-start" onclick="iniciarOuvinte()">► Iniciar Ouvinte</button>
        <button id="btn-stop" class="btn-stop" onclick="pararOuvinte()">◼ Parar Ouvinte</button>
        <button class="btn-clear" onclick="limparHUD()">Limpar</button>
    </div>

    <div id="hud-container">
        <ul id="translation-list">
            <li class="translation-item status-item">CLIQUE EM "INICIAR OUVINTE" PARA COMEÇAR...</li>
        </ul>
    </div>

    <script>
        const SERVIDOR_URL = "https://hud-backend.vercel.app/api/processar-audio";

        let mediaRecorder = null;
        let globalStream = null;
        let isListening = false;
        let inactivityTimer = null;
        
        let sequenceCounter = 0;
        let nextToDisplay = 1;
        const pendingResponses = new Map();

        async function iniciarOuvinte() {
            try {
                globalStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 } 
                });
                isListening = true;
                sequenceCounter = 0;
                nextToDisplay = 1;
                pendingResponses.clear();

                document.getElementById('btn-start').style.display = 'none';
                document.getElementById('btn-stop').style.display = 'block';
                limparHUD();
                adicionarStatus("OUVINDO E TRADUZINDO EM TEMPO REAL...");

                gravadorLoop(globalStream);
                resetInactivityTimer();

            } catch (err) {
                alert("Erro ao acessar microfone. Certifique-se de permitir o acesso.");
            }
        }

        function gravadorLoop(stream) {
            if (!isListening) return;

            let chunks = [];
            const options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 16000 };
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch(e) {
                mediaRecorder = new MediaRecorder(stream);
            }
            
            sequenceCounter++;
            const currentSeq = sequenceCounter;

            mediaRecorder.ondataavailable = e => chunks.push(e.data);

            mediaRecorder.onstop = () => {
                if (chunks.length > 0) {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    enviarAudio(blob, currentSeq);
                }
                if (isListening) gravadorLoop(stream);
            };

            mediaRecorder.start();
            
            // Ajustado para 2.5 segundos (captura frases completas sem picotar)
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }, 2500);
        }

        function pararOuvinte() {
            isListening = false;
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }

            if (globalStream) {
                globalStream.getTracks().forEach(track => track.stop());
                globalStream = null;
            }

            clearTimeout(inactivityTimer);

            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';
            adicionarStatus("OUVINDO DESATIVADO.");
        }

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => pararOuvinte(), 30 * 60 * 1000);
        }

        async function enviarAudio(blobAudio, seq) {
            const formData = new FormData();
            formData.append('audio', blobAudio, 'audio.webm');

            try {
                const res = await fetch(SERVIDOR_URL, { method: 'POST', body: formData });
                const data = await res.json();
                
                pendingResponses.set(seq, data.traducao || "");
                processarFila();

            } catch (err) {
                console.error("Erro no envio:", err);
                pendingResponses.set(seq, "");
                processarFila();
            }
        }

        function processarFila() {
            while (pendingResponses.has(nextToDisplay)) {
                const traducao = pendingResponses.get(nextToDisplay);
                pendingResponses.delete(nextToDisplay);

                if (traducao && traducao.length > 0) {
                    resetInactivityTimer();
                    adicionarAoHUD(traducao);
                }
                nextToDisplay++;
            }
        }

        function adicionarAoHUD(texto) {
            const container = document.getElementById('hud-container');
            const list = document.getElementById('translation-list');

            if (list.children[0] && list.children[0].classList.contains('status-item')) {
                list.innerHTML = "";
            }

            const li = document.createElement('li');
            li.className = 'translation-item';
            li.innerText = texto;
            list.appendChild(li);

            while (list.offsetHeight > (container.clientHeight - 15) && list.children.length > 1) {
                list.removeChild(list.firstChild);
            }
        }

        function adicionarStatus(msg) {
            const list = document.getElementById('translation-list');
            const li = document.createElement('li');
            li.className = 'translation-item status-item';
            li.innerText = msg;
            list.appendChild(li);
        }

        function limparHUD() { 
            document.getElementById('translation-list').innerHTML = ''; 
        }
    </script>
</body>
</html>
