<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>TRANSLATOR HUD</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {

    background: #000;

    color: #fff;

    font-family: 'Segoe UI', sans-serif;

    height: 100vh;

    display: flex;

    flex-direction: column;

    padding: 10px;

}


#top-bar {

    display: flex;

    gap: 6px;

    margin-bottom: 8px;

}


button {

    flex: 1;

    padding: 14px;

    font-weight: bold;

    font-size: 12px;

    border: none;

    border-radius: 4px;

    cursor: pointer;

    text-transform: uppercase;

}


.btn-start {

    background: #28a745;

    color: white;

}


.btn-stop {

    background: #dc3545;

    color: white;

    display: none;

}


.btn-clear {

    background: #444;

    color: white;

    flex: 0 0 80px;

}


#hud-container {

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    border: 1px solid #222;

    border-radius: 6px;

    padding: 10px;

    background: #050505;

    overflow: hidden;

}


#translation-list {

    list-style: none;

    display: flex;

    flex-direction: column;

    gap: 10px;

    width: 100%;

}


.translation-item {

    font-size: 22px;

    font-weight: bold;

    color: #00ffcc;

    text-shadow: 0 0 8px rgba(0,255,204,0.4);

    border-left: 4px solid #00ffcc;

    padding-left: 10px;

    font-family: 'Impact', sans-serif;

    word-wrap: break-word;

}


.status-item {

    color: #666;

    border-left-color: #333;

    font-size: 13px;

    font-weight: normal;

    font-family: sans-serif;

}

</style>

</head>


<body>


<div id="top-bar">

<button
    id="btn-start"
    class="btn-start"
    onclick="iniciarOuvinte()"
>
► INICIAR
</button>


<button
    id="btn-stop"
    class="btn-stop"
    onclick="pararOuvinte()"
>
■ PARAR
</button>


<button
    class="btn-clear"
    onclick="limparHUD()"
>
LIMPAR
</button>

</div>


<div id="hud-container">

<ul id="translation-list">

<li class="translation-item status-item">
PRONTO PARA OUVIR...
</li>

</ul>

</div>


<script>


/*
=========================================================
CONFIGURAÇÃO
=========================================================
*/


const TAMANHO_BLOCO_MS = 1000;


/*
=========================================================
VARIÁVEIS
=========================================================
*/


let socket = null;

let audioContext = null;

let microphone = null;

let processor = null;

let globalStream = null;

let isListening = false;

let sequence = 0;


/*
Fila de respostas.

Serve apenas para garantir que uma tradução
não apareça antes de outra.
*/

let respostasPendentes = new Map();

let proximaSequencia = 1;


/*
Buffer de áudio PCM
*/

let audioBuffer = [];

let sampleRate = 44100;


/*
=========================================================
INICIAR
=========================================================
*/


async function iniciarOuvinte() {

    try {


        limparHUD();


        adicionarStatus(
            "SOLICITANDO MICROFONE..."
        );


        /*
        Microfone
        */

        globalStream =
            await navigator.mediaDevices.getUserMedia({

                audio: {

                    echoCancellation: false,

                    noiseSuppression: false,

                    autoGainControl: true

                }

            });


        adicionarStatus(
            "MICROFONE CONECTADO."
        );


        /*
        WebSocket
        */

        const protocol =
            window.location.protocol === 'https:'
                ? 'wss:'
                : 'ws:';


        socket =
            new WebSocket(
                `${protocol}//${window.location.host}`
            );


        socket.onopen = async () => {


            isListening = true;

            sequence = 0;

            proximaSequencia = 1;

            respostasPendentes.clear();


            document
                .getElementById('btn-start')
                .style.display = 'none';


            document
                .getElementById('btn-stop')
                .style.display = 'block';


            adicionarStatus(
                "OUVINDO EM TEMPO REAL..."
            );


            /*
            AudioContext
            */

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            if (
                audioContext.state === 'suspended'
            ) {

                await audioContext.resume();

            }


            sampleRate =
                audioContext.sampleRate;


            /*
            Entrada do microfone
            */

            microphone =
                audioContext.createMediaStreamSource(
                    globalStream
                );


            /*
            ScriptProcessor é utilizado aqui
            para manter o protótipo simples
            e compatível com o navegador móvel.
            */

            processor =
                audioContext.createScriptProcessor(
                    4096,
                    1,
                    1
                );


            microphone.connect(processor);

            processor.connect(
                audioContext.destination
            );


            processor.onaudioprocess =
                capturarAudio;


            adicionarStatus(
                "TRADUÇÃO ATIVA."
            );

        };


        /*
        Recebe respostas do servidor
        */

        socket.onmessage = (event) => {


            try {

                const data =
                    JSON.parse(event.data);


                if (
                    data.type === 'translation'
                ) {

                    respostasPendentes.set(
                        data.sequence,
                        data.text
                    );


                    processarFila();

                }


            } catch (error) {

                console.error(
                    "Erro recebendo tradução:",
                    error
                );

            }

        };


        socket.onerror = () => {

            adicionarStatus(
                "ERRO NA CONEXÃO."
            );

        };


        socket.onclose = () => {

            if (isListening) {

                adicionarStatus(
                    "CONEXÃO ENCERRADA."
                );

            }

        };


    } catch (error) {


        console.error(error);


        adicionarStatus(
            "ERRO: " + error.message
        );


    }

}


/*
=========================================================
CAPTURA CONTÍNUA
=========================================================
*/


function capturarAudio(event) {


    if (!isListening) {
        return;
    }


    const input =
        event.inputBuffer.getChannelData(0);


    /*
    Copia o áudio para não depender
    do buffer interno do navegador.
    */

    for (
        let i = 0;
        i < input.length;
        i++
    ) {

        audioBuffer.push(input[i]);

    }


    /*
    Quando atingir aproximadamente
    1 segundo, envia o bloco.
    */

    const quantidadeNecessaria =
        sampleRate *
        (TAMANHO_BLOCO_MS / 1000);


    if (
        audioBuffer.length >=
        quantidadeNecessaria
    ) {


        const bloco =
            audioBuffer.splice(
                0,
                quantidadeNecessaria
            );


        enviarBloco(
            bloco,
            sequence++
        );

    }

}


/*
=========================================================
CONVERTE PCM PARA WAV
=========================================================
*/


function criarWav(
    samples,
    sampleRate
) {


    const buffer =
        new ArrayBuffer(
            44 + samples.length * 2
        );


    const view =
        new DataView(buffer);


    escreverTexto(
        view,
        0,
        'RIFF'
    );


    view.setUint32(
        4,
        36 + samples.length * 2,
        true
    );


    escreverTexto(
        view,
        8,
        'WAVE'
    );


    escreverTexto(
        view,
        12,
        'fmt '
    );


    view.setUint32(
        16,
        16,
        true
    );


    view.setUint16(
        20,
        1,
        true
    );


    view.setUint16(
        22,
        1,
        true
    );


    view.setUint32(
        24,
        sampleRate,
        true
    );


    view.setUint32(
        28,
        sampleRate * 2,
        true
    );


    view.setUint16(
        32,
        2,
        true
    );


    view.setUint16(
        34,
        16,
        true
    );


    escreverTexto(
        view,
        36,
        'data'
    );


    view.setUint32(
        40,
        samples.length * 2,
        true
    );


    let offset = 44;


    for (
        let i = 0;
        i < samples.length;
        i++
    ) {


        let valor =
            Math.max(
                -1,
                Math.min(
                    1,
                    samples[i]
                )
            );


        valor =
            valor < 0
                ? valor * 0x8000
                : valor * 0x7FFF;


        view.setInt16(
            offset,
            valor,
            true
        );


        offset += 2;

    }


    return new Blob(
        [buffer],
        {
            type: 'audio/wav'
        }
    );

}


function escreverTexto(
    view,
    offset,
    texto
) {


    for (
        let i = 0;
        i < texto.length;
        i++
    ) {

        view.setUint8(
            offset + i,
            texto.charCodeAt(i)
        );

    }

}


/*
=========================================================
ENVIA BLOCO
=========================================================
*/


async function enviarBloco(
    samples,
    numero
) {


    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return;

    }


    const wav =
        criarWav(
            samples,
            sampleRate
        );


    const reader =
        new FileReader();


    reader.onloadend = () => {


        const base64 =
            reader.result
                .split(',')[1];


        socket.send(
            JSON.stringify({

                type: 'audio_chunk',

                sequence: numero,

                audio: base64

            })
        );

    };


    reader.readAsDataURL(wav);

}


/*
=========================================================
FILA DE TRADUÇÃO
=========================================================
*/


function processarFila() {


    while (
        respostasPendentes.has(
            proximaSequencia
        )
    ) {


        const texto =
            respostasPendentes.get(
                proximaSequencia
            );


        respostasPendentes.delete(
            proximaSequencia
        );


        if (
            texto &&
            texto.trim()
        ) {

            adicionarTraducao(
                texto
            );

        }


        proximaSequencia++;

    }

}


/*
=========================================================
HUD
=========================================================
*/


function adicionarTraducao(
    texto
) {


    const list =
        document.getElementById(
            'translation-list'
        );


    if (
        list.children[0] &&
        list.children[0]
            .classList
            .contains('status-item')
    ) {

        list.innerHTML = "";

    }


    const li =
        document.createElement('li');


    li.className =
        'translation-item';


    li.innerText =
        texto;


    list.appendChild(li);


    limitarHUD();

}


function adicionarStatus(
    texto
) {


    const list =
        document.getElementById(
            'translation-list'
        );


    const li =
        document.createElement('li');


    li.className =
        'translation-item status-item';


    li.innerText =
        texto;


    list.appendChild(li);


    limitarHUD();

}


function limitarHUD() {


    const container =
        document.getElementById(
            'hud-container'
        );


    const list =
        document.getElementById(
            'translation-list'
        );


    while (
        list.offsetHeight >
        container.clientHeight - 15
        &&
        list.children.length > 1
    ) {

        list.removeChild(
            list.firstChild
        );

    }

}


/*
=========================================================
PARAR
=========================================================
*/


function pararOuvinte() {


    isListening = false;


    if (processor) {

        processor.disconnect();

        processor = null;

    }


    if (microphone) {

        microphone.disconnect();

        microphone = null;

    }


    if (audioContext) {

        audioContext.close();

        audioContext = null;

    }


    if (globalStream) {

        globalStream
            .getTracks()
            .forEach(
                track => track.stop()
            );


        globalStream = null;

    }


    if (socket) {

        socket.close();

        socket = null;

    }


    audioBuffer = [];


    document
        .getElementById('btn-start')
        .style.display = 'block';


    document
        .getElementById('btn-stop')
        .style.display = 'none';


    adicionarStatus(
        "OUVINDO DESATIVADO."
    );

}


/*
=========================================================
LIMPAR
=========================================================
*/


function limparHUD() {

    document
        .getElementById(
            'translation-list'
        )
        .innerHTML = '';

}

</script>

</body>

</html>
