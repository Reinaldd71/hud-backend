<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>TRANSLATOR HUD</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {

    background: #000;

    color: #fff;

    font-family: 'Segoe UI', sans-serif;

    height: 100vh;

    display: flex;

    flex-direction: column;

    padding: 10px;

}


#top-bar {

    display: flex;

    gap: 6px;

    margin-bottom: 8px;

}


button {

    flex: 1;

    padding: 14px;

    font-weight: bold;

    font-size: 12px;

    border: none;

    border-radius: 4px;

    cursor: pointer;

    text-transform: uppercase;

}


.btn-start {

    background: #28a745;

    color: white;

}


.btn-stop {

    background: #dc3545;

    color: white;

    display: none;

}


.btn-clear {

    background: #444;

    color: white;

    flex: 0 0 80px;

}


#hud-container {

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    border: 1px solid #222;

    border-radius: 6px;

    padding: 10px;

    background: #050505;

    overflow: hidden;

}


#translation-list {

    list-style: none;

    display: flex;

    flex-direction: column;

    gap: 10px;

    width: 100%;

}


.translation-item {

    font-size: 22px;

    font-weight: bold;

    line-height: 1.25;

    color: #00ffcc;

    text-shadow:
        0 0 8px rgba(0,255,204,0.4);

    border-left:
        4px solid #00ffcc;

    padding-left: 10px;

    font-family:
        'Impact',
        'Arial Black',
        sans-serif;

    word-wrap: break-word;

}


.status-item {

    color: #666;

    border-left-color: #333;

    font-size: 13px;

    font-weight: normal;

    font-family: sans-serif;

}

</style>

</head>


<body>


<div id="top-bar">

<button
    id="btn-start"
    class="btn-start"
    onclick="iniciarOuvinte()"
>
► INICIAR
</button>


<button
    id="btn-stop"
    class="btn-stop"
    onclick="pararOuvinte()"
>
■ PARAR
</button>


<button
    class="btn-clear"
    onclick="limparHUD()"
>
LIMPAR
</button>

</div>


<div id="hud-container">

<ul id="translation-list">

<li class="translation-item status-item">
PRONTO PARA OUVIR...
</li>

</ul>

</div>


<script>


/*
=========================================================
CONFIGURAÇÃO
=========================================================
*/


const INTERVALO_GRAVACAO = 1800;


/*
=========================================================
VARIÁVEIS
=========================================================
*/


let socket = null;

let mediaRecorder = null;

let globalStream = null;

let isListening = false;

let gravando = false;


/*
=========================================================
INICIAR
=========================================================
*/


async function iniciarOuvinte() {

    try {


        /*
        Abre o microfone
        */

        globalStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: {

                        echoCancellation: false,

                        noiseSuppression: false,

                        autoGainControl: true

                    }

                });


        /*
        Conecta ao servidor
        */

        const protocol =
            window.location.protocol === 'https:'
                ? 'wss:'
                : 'ws:';


        socket =
            new WebSocket(
                `${protocol}//${window.location.host}`
            );


        socket.onopen = () => {


            isListening = true;


            document
                .getElementById('btn-start')
                .style.display = 'none';


            document
                .getElementById('btn-stop')
                .style.display = 'block';


            limparHUD();


            adicionarStatus(
                'OUVINDO EM TEMPO REAL...'
            );


            iniciarGravacao();

        };


        /*
        Recebe tradução
        */

        socket.onmessage = (event) => {

            try {

                const data =
                    JSON.parse(event.data);


                if (
                    data.type === 'translation' &&
                    data.text
                ) {

                    adicionarTraducao(
                        data.text
                    );

                }


                if (
                    data.type === 'error'
                ) {

                    adicionarStatus(
                        data.text
                    );

                }

            } catch (error) {

                console.error(
                    error
                );

            }

        };


        socket.onerror = () => {

            adicionarStatus(
                'ERRO DE CONEXÃO.'
            );

        };


        socket.onclose = () => {

            if (isListening) {

                adicionarStatus(
                    'CONEXÃO ENCERRADA.'
                );

            }

        };


    } catch (error) {

        adicionarStatus(
            'ERRO NO MICROFONE: ' +
            error.message
        );

    }

}


/*
=========================================================
GRAVAÇÃO EM CICLOS
=========================================================
*/


function iniciarGravacao() {

    if (!isListening) {
        return;
    }


    const chunks = [];


    mediaRecorder =
        new MediaRecorder(
            globalStream
        );


    mediaRecorder.ondataavailable =
        (event) => {

            if (
                event.data &&
                event.data.size > 0
            ) {

                chunks.push(
                    event.data
                );

            }

        };


    mediaRecorder.onstop = () => {


        gravando = false;


        if (
            chunks.length > 0 &&
            isListening
        ) {

            const blob =
                new Blob(
                    chunks,
                    {
                        type:
                            'audio/webm'
                    }
                );


            enviarAudio(
                blob
            );

        }


        /*
        Começa imediatamente
        o próximo ciclo.
        */

        if (isListening) {

            setTimeout(
                iniciarGravacao,
                50
            );

        }

    };


    mediaRecorder.start();


    gravando = true;


    setTimeout(
        () => {

            if (
                mediaRecorder &&
                mediaRecorder.state ===
                'recording'
            ) {

                mediaRecorder.stop();

            }

        },
        INTERVALO_GRAVACAO
    );

}


/*
=========================================================
ENVIA ÁUDIO
=========================================================
*/


function enviarAudio(
    blob
) {


    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return;

    }


    const reader =
        new FileReader();


    reader.onloadend = () => {


        const base64 =
            reader.result
                .split(',')[1];


        socket.send(

            JSON.stringify({

                type:
                    'audio_chunk',

                audio:
                    base64

            })

        );

    };


    reader.readAsDataURL(
        blob
    );

}


/*
=========================================================
TRADUÇÃO NO HUD
=========================================================
*/


function adicionarTraducao(
    texto
) {


    const list =
        document.getElementById(
            'translation-list'
        );


    /*
    Remove mensagens de status
    */

    while (
        list.children.length > 0 &&
        list.children[0]
            .classList
            .contains(
                'status-item'
            )
    ) {

        list.removeChild(
            list.children[0]
        );

    }


    const li =
        document.createElement(
            'li'
        );


    li.className =
        'translation-item';


    li.innerText =
        texto;


    list.appendChild(
        li
    );


    limitarHUD();

}


/*
=========================================================
STATUS
=========================================================
*/


function adicionarStatus(
    texto
) {


    const list =
        document.getElementById(
            'translation-list'
        );


    const li =
        document.createElement(
            'li'
        );


    li.className =
        'translation-item status-item';


    li.innerText =
        texto;


    list.appendChild(
        li
    );


    limitarHUD();

}


/*
=========================================================
LIMITE DO HUD
=========================================================
*/


function limitarHUD() {


    const container =
        document.getElementById(
            'hud-container'
        );


    const list =
        document.getElementById(
            'translation-list'
        );


    while (
        list.offsetHeight >
        container.clientHeight - 15
        &&
        list.children.length > 1
    ) {

        list.removeChild(
            list.firstChild
        );

    }

}


/*
=========================================================
PARAR
=========================================================
*/


function pararOuvinte() {


    isListening = false;


    if (
        mediaRecorder &&
        mediaRecorder.state !==
        'inactive'
    ) {

        mediaRecorder.stop();

    }


    if (globalStream) {

        globalStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        globalStream = null;

    }


    if (socket) {

        socket.close();

        socket = null;

    }


    document
        .getElementById('btn-start')
        .style.display = 'block';


    document
        .getElementById('btn-stop')
        .style.display = 'none';


    adicionarStatus(
        'OUVINDO DESATIVADO.'
    );

}


/*
=========================================================
LIMPAR
=========================================================
*/


function limparHUD() {

    document
        .getElementById(
            'translation-list'
        )
        .innerHTML = '';

}

</script>

</body>

</html>
