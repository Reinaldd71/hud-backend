<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRANSLATOR HUD - REALTIME</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        #top-bar { display: flex; gap: 6px; margin-bottom: 8px; }
        button { flex: 1; padding: 14px; font-weight: bold; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; display: none; }
        .btn-clear { background: #444; color: white; flex: 0 0 80px; }
        #hud-container { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid #222; border-radius: 6px; padding: 10px; background: #050505; overflow: hidden; }
        #translation-list { list-style: none; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .translation-item { font-size: 22px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,204,0.4); border-left: 4px solid #00ffcc; padding-left: 10px; font-family: 'Impact', sans-serif; letter-spacing: 0.5px; word-wrap: break-word; }
        .status-item { color: #888; border-left-color: #555; font-size: 14px; font-weight: normal; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="top-bar">
        <button id="btn-start" class="btn-start" onclick="iniciarOuvinte()">► Iniciar Ouvinte</button>
        <button id="btn-stop" class="btn-stop" onclick="pararOuvinte()">◼ Parar Ouvinte</button>
        <button class="btn-clear" onclick="limparHUD()">Limpar</button>
    </div>

    <div id="hud-container">
        <ul id="translation-list">
            <li class="translation-item status-item">CLIQUE EM "INICIAR OUVINTE" PARA COMEÇAR...</li>
        </ul>
    </div>

    <script>
        let socket = null;
        let audioContext = null;
        let processor = null;
        let globalStream = null;
        let isListening = false;
        let currentLi = null;

        async function iniciarOuvinte() {
            try {
                // Detecta se é conexão segura (wss://) ou padrão (ws://)
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${protocol}//${window.location.host}`);

                socket.onopen = async () => {
                    adicionarStatus("CONECTADO AO SERVIDOR DE STREAMING EM TEMPO REAL.");
                    document.getElementById('btn-start').style.display = 'none';
                    document.getElementById('btn-stop').style.display = 'block';
                    limparHUD();
                    isListening = true;

                    // Captura de áudio contínua em PCM16 para a OpenAI
                    globalStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                    
                    const source = audioContext.createMediaStreamSource(globalStream);
                    processor = audioContext.createScriptProcessor(4096, 1, 1);

                    processor.onaudioprocess = (e) => {
                        if (!isListening || socket.readyState !== WebSocket.OPEN) return;
                        
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                        }
                        
                        // Transforma o áudio em base64 e envia pelo WebSocket
                        const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
                        socket.send(JSON.stringify({ type: 'audio', audio: base64Audio }));
                    };

                    source.connect(processor);
                    processor.connect(audioContext.destination);
                };

                // Recebe as palavras sendo traduzidas em tempo real
                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'text_chunk') {
                        if (!currentLi) {
                            currentLi = criarElemento HUD();
                        }
                        currentLi.innerText += data.text;
                        rolarHUD();
                    } else if (data.type === 'text_done') {
                        currentLi = null; // Finaliza a frase atual
                    }
                };

                socket.onclose = () => {
                    if (isListening) pararOuvinte();
                };

            } catch (err) {
                alert("Erro ao conectar microfone/servidor.");
            }
        }

        function pararOuvinte() {
            isListening = false;
            
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();
            if (globalStream) globalStream.getTracks().forEach(t => t.stop());
            if (socket) socket.close();

            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';
            adicionarStatus("OUVINDO DESATIVADO.");
        }

        function criarElementoHUD() {
            const list = document.getElementById('translation-list');
            if (list.children[0] && list.children[0].classList.contains('status-item')) {
                list.innerHTML = "";
            }
            const li = document.createElement('li');
            li.className = 'translation-item';
            list.appendChild(li);
            return li;
        }

        function rolarHUD() {
            const container = document.getElementById('hud-container');
            const list = document.getElementById('translation-list');
            while (list.offsetHeight > (container.clientHeight - 15) && list.children.length > 1) {
                list.removeChild(list.firstChild);
            }
        }

        function adicionarStatus(msg) {
            const list = document.getElementById('translation-list');
            const li = document.createElement('li');
            li.className = 'translation-item status-item';
            li.innerText = msg;
            list.appendChild(li);
        }

        function limparHUD() { 
            document.getElementById('translation-list').innerHTML = ''; 
        }
    </script>
</body>
</html>
