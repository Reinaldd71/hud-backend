<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRANSLATOR HUD - V2 DETECTOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        #top-bar { display: flex; gap: 6px; margin-bottom: 8px; }
        button { flex: 1; padding: 14px; font-weight: bold; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; display: none; }
        .btn-clear { background: #444; color: white; flex: 0 0 80px; }
        #hud-container { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid #222; border-radius: 6px; padding: 10px; background: #050505; overflow: hidden; }
        #translation-list { list-style: none; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .translation-item { font-size: 22px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,204,0.4); border-left: 4px solid #00ffcc; padding-left: 10px; font-family: 'Impact', sans-serif; word-wrap: break-word; }
        .status-item { color: #888; border-left-color: #555; font-size: 14px; font-weight: normal; font-family: sans-serif; }
        .status-active { color: #ffcc00; border-left-color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div id="top-bar">
        <button id="btn-start" class="btn-start" onclick="iniciarOuvinte()">► Iniciar Ouvinte</button>
        <button id="btn-stop" class="btn-stop" onclick="pararOuvinte()">◼ Parar Ouvinte</button>
        <button class="btn-clear" onclick="limparHUD()">Limpar</button>
    </div>

    <div id="hud-container">
        <ul id="translation-list">
            <li class="translation-item status-item">CLIQUE EM "INICIAR OUVINTE" PARA COMEÇAR...</li>
        </ul>
    </div>

    <script>
        let socket = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let isListening = false;
        let speaking = false;
        let silenceTimer = null;
        let statusElement = null;

        async function iniciarOuvinte() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${protocol}//${window.location.host}`);

                socket.onopen = async () => {
                    document.getElementById('btn-start').style.display = 'none';
                    document.getElementById('btn-stop').style.display = 'block';
                    adicionarStatus("OUVINDO... (AGUARDANDO ÁUDIO EM INGLÊS)");
                    isListening = true;

                    // Desbloqueia o AudioContext no Android
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }

                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                    analyser.fftSize = 512;

                    // Configura o gravador de áudio
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        if (audioChunks.length > 0 && isListening) {
                            adicionarStatus("⏳ PROCESSANDO TRADUÇÃO...", true);
                            const blob = new Blob(audioChunks, { type: 'audio/webm' });
                            audioChunks = [];
                            
                            const reader = new FileReader();
                            reader.readAsDataURL(blob);
                            reader.onloadend = () => {
                                const base64Audio = reader.result.split(',')[1];
                                if (socket.readyState === WebSocket.OPEN) {
                                    socket.send(JSON.stringify({ type: 'audio_chunk', audio: base64Audio }));
                                }
                            };
                        }
                    };

                    monitorarVoz();
                };

                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'translation') {
                        adicionarTraducao(data.text);
                    }
                };

            } catch (err) {
                alert("Erro ao conectar microfone: " + err.message);
            }
        }

        function monitorarVoz() {
            if (!isListening) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < bufferLength; i++) {
                sum += dataArray[i];
            }
            const average = sum / bufferLength;

            // Limiar de detecção (VAD) ajustado para maior sensibilidade
            if (average > 8) { 
                if (!speaking) {
                    speaking = true;
                    adicionarStatus("🎤 FALANDO DETECTADO!", true);
                    if (mediaRecorder.state === 'inactive') {
                        audioChunks = [];
                        mediaRecorder.start();
                    }
                }
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (speaking) {
                        speaking = false;
                        if (mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }
                }, 600); // 600ms de pausa fecha o bloco
            }

            requestAnimationFrame(monitorarVoz);
        }

        function pararOuvinte() {
            isListening = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (audioContext) audioContext.close();
            if (socket) socket.close();

            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';
            adicionarStatus("OUVINDO DESATIVADO.");
        }

        function adicionarTraducao(texto) {
            const list = document.getElementById('translation-list');
            const li = document.createElement('li');
            li.className = 'translation-item';
            li.innerText = texto;
            list.appendChild(li);
            rolarHUD();
        }

        function adicionarStatus(msg, emDestaque = false) {
            const list = document.getElementById('translation-list');
            const li = document.createElement('li');
            li.className = emDestaque ? 'translation-item status-active' : 'translation-item status-item';
            li.innerText = msg;
            list.appendChild(li);
            rolarHUD();
        }

        function rolarHUD() {
            const container = document.getElementById('hud-container');
            const list = document.getElementById('translation-list');
            while (list.offsetHeight > (container.clientHeight - 15) && list.children.length > 1) {
                list.removeChild(list.firstChild);
            }
        }

        function limparHUD() { 
            document.getElementById('translation-list').innerHTML = ''; 
        }
    </script>
</body>
</html>
